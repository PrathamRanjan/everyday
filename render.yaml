envVarGroups:
  - name: ev-shared
    envVars:
      - key: PAYPAL_ENV
        value: sandbox
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: APP_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        generateValue: true
      - key: EV_DEMO_MODE
        value: "true"
      - key: NODE_VERSION
        value: "22"

databases:
  - name: ev-db
    plan: basic-256mb

services:
  - type: web
    name: ev-web
    runtime: node
    plan: starter
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - fromGroup: ev-shared
      - key: EV_INLINE_WORKER
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: ev-db
          property: connectionString

  - type: worker
    name: ev-worker
    runtime: node
    plan: starter
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run worker
    envVars:
      - fromGroup: ev-shared
      - key: DATABASE_URL
        fromDatabase:
          name: ev-db
          property: connectionString
